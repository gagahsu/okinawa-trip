<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沖繩四天三夜 · 親子行程</title>
<meta name="theme-color" content="#0E7C86">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --sand:#FFF6E9;
    --sand-deep:#FDE9C8;
    --ocean:#0E7C86;
    --ocean-deep:#0A5C64;
    --coral:#FF7A59;
    --coral-deep:#E85D3D;
    --sun:#FFC33D;
    --ink:#2B3A3A;
    --card:#FFFFFF;
    --line:#E8DCC4;
    --shadow: 0 6px 0 rgba(43,58,58,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 10% 0%, #CFEFEF 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #FFE3C4 0%, transparent 40%),
      var(--sand);
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    padding-bottom:60px;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2','Noto Sans TC',sans-serif;
  }

  /* ---------- HERO ---------- */
  .hero{
    padding:36px 20px 18px;
    text-align:center;
  }
  .hero .eyebrow{
    display:inline-block;
    background:var(--ocean);
    color:#fff;
    font-weight:700;
    font-size:13px;
    letter-spacing:.08em;
    padding:5px 14px;
    border-radius:999px;
    margin-bottom:12px;
  }
  .hero h1{
    font-size:clamp(28px,6vw,42px);
    font-weight:800;
    color:var(--ocean-deep);
    margin:0 0 6px;
  }
  .hero p{
    margin:0;
    color:#5b6d6d;
    font-size:15px;
  }

  /* ---------- ROUTE MAP (signature) ---------- */
  .route-wrap{
    margin:22px auto 8px;
    max-width:980px;
    padding:0 12px;
  }
  .route-card{
    background:var(--card);
    border-radius:26px;
    box-shadow:var(--shadow);
    border:2px solid var(--line);
    padding:18px 8px 22px;
    overflow-x:auto;
  }
  .route-title{
    text-align:center;
    font-size:14px;
    font-weight:700;
    color:var(--ocean-deep);
    letter-spacing:.04em;
    margin-bottom:6px;
  }
  .route-svg-holder{
    min-width:820px;
    min-height:235px;
  }
  .route-node-label{
    font-family:'Noto Sans TC',sans-serif;
    font-size:11.5px;
    font-weight:700;
    fill:var(--ink);
  }
  .route-node-sub{
    font-family:'Noto Sans TC',sans-serif;
    font-size:9.5px;
    fill:#7a8a8a;
  }

  /* ---------- CONTROLS ---------- */
  .controls{
    max-width:980px;
    margin:22px auto 0;
    padding:0 20px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:center;
  }
  .controls label{
    font-size:13px;
    font-weight:700;
    color:var(--ocean-deep);
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--card);
    border:2px solid var(--line);
    padding:8px 14px;
    border-radius:999px;
  }
  .controls input[type="number"]{
    width:52px;
    border:none;
    border-bottom:2px solid var(--coral);
    font-size:14px;
    font-weight:700;
    text-align:center;
    background:transparent;
    color:var(--coral-deep);
  }
  .controls input:focus{outline:none;}
  .notify-btn{
    border:2px solid var(--ocean);
    background:var(--ocean);
    color:#fff;
    font-weight:700;
    font-size:13px;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .notify-btn:hover{transform:translateY(-1px);}
  .notify-btn.active{background:var(--sun);border-color:var(--sun);color:var(--ink);}

  /* ---------- DAY TABS ---------- */
  .tabs{
    max-width:980px;
    margin:20px auto 0;
    padding:0 20px;
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .tab{
    cursor:pointer;
    border:2px solid var(--line);
    background:var(--card);
    border-radius:16px;
    padding:10px 16px;
    text-align:center;
    min-width:96px;
    transition:all .15s ease;
  }
  .tab .tab-day{font-family:'Baloo 2';font-weight:800;font-size:15px;color:var(--ocean-deep);}
  .tab .tab-date{font-size:11px;color:#8a9a9a;font-weight:600;}
  .tab .tab-theme{font-size:11px;color:var(--coral-deep);font-weight:700;margin-top:2px;}
  .tab.active{
    background:var(--ocean);
    border-color:var(--ocean);
  }
  .tab.active .tab-day, .tab.active .tab-date, .tab.active .tab-theme{color:#fff;}
  .tab-break{
    flex-basis:100%;
    height:8px;
  }

  /* ---------- TIMELINE ---------- */
  .timeline-wrap{
    max-width:760px;
    margin:26px auto 0;
    padding:0 20px;
  }
  .day-panel{display:none;}
  .day-panel.active{display:block;}
  .timeline{
    position:relative;
    padding-left:34px;
  }
  .timeline::before{
    content:"";
    position:absolute;
    left:11px;
    top:6px;
    bottom:6px;
    width:3px;
    background:repeating-linear-gradient(to bottom, var(--sun) 0 8px, transparent 8px 14px);
    border-radius:3px;
  }
  .item{
    position:relative;
    margin-bottom:16px;
  }
  .item::before{
    content:attr(data-icon);
    position:absolute;
    left:-34px;
    top:0;
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--card);
    border:2px solid var(--ocean);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    z-index:2;
  }
  .item.transition::before{border-color:var(--coral);background:#FFF0EA;}
  .item-card{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:16px;
    padding:12px 16px;
    box-shadow:var(--shadow);
  }
  .item-top{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .item-time{
    font-family:'Baloo 2';
    font-weight:800;
    font-size:17px;
    color:var(--ocean-deep);
  }
  .item-title{
    font-weight:700;
    font-size:15px;
    color:var(--ink);
  }
  .item-note{
    margin-top:4px;
    font-size:13px;
    color:#6b7a7a;
    line-height:1.5;
  }
  .reminder-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    background:#FFF0EA;
    border:1.5px dashed var(--coral);
    color:var(--coral-deep);
    font-size:12.5px;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
  }
  .nav-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    margin-left:6px;
    background:#EAF7F5;
    border:1.5px dashed var(--ocean);
    color:var(--ocean-deep);
    font-size:12.5px;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
  }
  .item-tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:6px;
  }
  .item-tag{
    position:relative;
    display:inline-flex;
    align-items:center;
    padding:4px 10px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:700;
    cursor:default;
    border:1.5px solid var(--ocean);
    color:var(--ocean-deep);
    background:#EAF7F5;
  }
  .item-tag.tag-shoes{ border-color:var(--coral); color:var(--coral-deep); background:#FFF0EA; }
  .item-tag.tag-gift{ border-color:var(--sun); color:#8A6300; background:#FFF7E0; }
  .item-tag.tag-store{ border-color:var(--ink); color:var(--ink); background:var(--sand-deep); }
  .item-tag:hover::after{
    content:attr(data-tooltip);
    position:absolute;
    bottom:130%;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    font-weight:500;
    font-size:12px;
    line-height:1.5;
    padding:8px 10px;
    border-radius:8px;
    white-space:pre-line;
    width:max-content;
    max-width:220px;
    box-shadow:0 6px 16px rgba(0,0,0,.2);
    z-index:30;
  }
  .item-tag:hover::before{
    content:'';
    position:absolute;
    bottom:118%;
    left:50%;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-top-color:var(--ink);
    z-index:30;
  }
  .day-summary{
    text-align:center;
    font-size:13px;
    color:#7a8a8a;
    margin-bottom:18px;
    background:var(--sand-deep);
    border-radius:14px;
    padding:8px 14px;
    border:1px dashed var(--coral);
  }
  .lodging{
    text-align:center;
    font-size:13px;
    font-weight:700;
    color:var(--ocean-deep);
    margin-top:18px;
    padding:10px;
    background:#EAF7F5;
    border-radius:14px;
  }

  /* ---------- NOTES / PACKING PANELS ---------- */
  .info-card{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
    box-shadow:var(--shadow);
    margin-bottom:16px;
  }
  .info-card h3{
    margin:0 0 10px;
    font-size:16px;
    color:var(--ocean-deep);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .info-card ul{
    margin:0;
    padding-left:0;
    list-style:none;
  }
  .info-card li{
    position:relative;
    padding:6px 0 6px 24px;
    font-size:14px;
    line-height:1.55;
    color:var(--ink);
    border-bottom:1px dashed var(--line);
  }
  .info-card li:last-child{border-bottom:none;}
  .info-card li::before{
    content:"✓";
    position:absolute;
    left:0;
    top:6px;
    color:var(--coral-deep);
    font-weight:700;
  }
  .info-card.warn li::before{
    content:"⚠️";
  }
  footer{
    max-width:760px;
    margin:34px auto 0;
    padding:0 20px;
    text-align:center;
    font-size:12px;
    color:#9aa8a8;
    line-height:1.7;
  }

  /* ---------- WEATHER (inline with route map) ---------- */
  .route-weather{
    display:flex;
    gap:6px;
    justify-content:center;
    flex-wrap:wrap;
    margin:2px 0 10px;
  }
  .weather-slot{
    display:flex;
    align-items:center;
    gap:5px;
    background:var(--sand-deep);
    border:1px dashed var(--coral);
    border-radius:999px;
    padding:3px 10px;
    font-size:11.5px;
    color:var(--ink);
    white-space:nowrap;
  }
  .weather-slot .ws-time{font-weight:700;color:var(--ocean-deep);}
  .weather-slot .ws-icon{font-size:14px;}
  .weather-slot .ws-rain{color:#8a6a4a;}
  .weather-note{
    text-align:center;
    font-size:11.5px;
    color:#9aa8a8;
    margin-top:2px;
  }

  /* ---------- ITEM ACTIONS (checkbox / ics / map link) ---------- */
  .item-actions{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px;
    align-items:center;
  }
  .done-toggle{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:700;
    color:var(--ocean-deep);
    cursor:pointer;
    background:#EAF7F5;
    border:1.5px solid var(--ocean);
    border-radius:999px;
    padding:4px 10px 4px 8px;
    user-select:none;
  }
  .done-toggle input{margin:0;}
  .item.done .item-title, .item.done .item-time{
    text-decoration:line-through;
    opacity:.55;
  }
  .item.done .item-card{opacity:.75;}

  /* ---------- PACKING CHECKLIST ---------- */
  .checklist-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:7px 0;
    font-size:14px;
    line-height:1.55;
    color:var(--ink);
    border-bottom:1px dashed var(--line);
  }
  .checklist-row:last-child{border-bottom:none;}
  .checklist-row input{margin-top:3px;flex-shrink:0;width:16px;height:16px;}
  .checklist-row label{cursor:pointer;}
  .checklist-row.done label{text-decoration:line-through;opacity:.5;}
  .packing-progress{
    text-align:center;
    font-size:13px;
    font-weight:700;
    color:var(--ocean-deep);
    margin:0 0 14px;
  }
  .ics-btn, .map-link{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12.5px;
    font-weight:700;
    border-radius:999px;
    padding:4px 10px;
    cursor:pointer;
    text-decoration:none;
    border:1.5px dashed var(--coral);
    color:var(--coral-deep);
    background:#FFF0EA;
  }
  .map-link{border-color:var(--ocean);color:var(--ocean-deep);background:#EAF7F5;}
  .ics-btn:hover, .map-link:hover{filter:brightness(0.97);}
  .top-ics-btn{
    border:2px solid var(--coral);
    background:var(--coral);
    color:#fff;
    font-weight:700;
    font-size:13px;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
  }
  .sync-note{
    font-size:11px;
    color:#9aa8a8;
    text-align:center;
    margin-top:4px;
  }

  /* ---------- CHAT WALL ---------- */
  .chat-wall{max-width:600px;margin:0 auto;}
  .chat-msgs{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:14px;
    max-height:420px;
    overflow-y:auto;
  }
  .chat-msg{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:14px;
    padding:8px 12px;
  }
  .chat-msg .cm-meta{font-size:11px;color:#8a9a9a;font-weight:700;margin-bottom:2px;}
  .chat-msg .cm-text{font-size:14px;color:var(--ink);}
  .chat-empty{text-align:center;font-size:13px;color:#9aa8a8;padding:12px;}
  .chat-form{
    display:flex;
    gap:8px;
  }
  .chat-form input[type="text"]{
    flex:1;
    border:2px solid var(--line);
    border-radius:999px;
    padding:9px 14px;
    font-size:14px;
    font-family:'Noto Sans TC',sans-serif;
  }
  .chat-form input[type="text"]:focus{outline:none;border-color:var(--ocean);}
  .chat-send{
    border:2px solid var(--ocean);
    background:var(--ocean);
    color:#fff;
    font-weight:700;
    border-radius:999px;
    padding:9px 16px;
    cursor:pointer;
  }
  .chat-name-row{
    text-align:center;
    font-size:12px;
    color:#7a8a8a;
    margin-bottom:10px;
  }
  .chat-name-row button{
    border:none;
    background:none;
    color:var(--ocean-deep);
    font-weight:700;
    text-decoration:underline;
    cursor:pointer;
    font-size:12px;
  }
</style>
</head>
<body>

<div class="hero">
  <span class="eyebrow">9/5 – 9/8 · TAINAN → OKINAWA → TAINAN</span>
  <h1>沖繩四天三夜 親子行 🐬</h1>
  <p>從台南出發，一路玩到沖繩北部與中部，再平安回家</p>
</div>

<div class="route-wrap">
  <div class="route-card">
    <div class="route-title" id="routeTitle">✈️ Day 1 路線（Q版地圖）</div>
    <div class="route-weather" id="routeWeather"></div>
    <div class="route-svg-holder" id="routeSvgHolder"></div>
  </div>
  <div class="weather-note" id="weatherNote"></div>
</div>

<div class="controls">
  <label>🔔 提醒提前 <input type="number" id="offset" value="10" min="0" max="60"> 分鐘</label>
  <button class="notify-btn" id="notifyBtn">啟用瀏覽器提醒（示範）</button>
  <button class="top-ics-btn" id="exportAllIcsBtn">📅 匯出整趟行程到行事曆</button>
</div>

<div class="tabs" id="tabs"></div>

<div class="timeline-wrap" id="panels"></div>

<footer>
🔔 提醒時間會依你設定的分鐘數自動往前計算並標示；真正會跳通知的方式請用「📅 加入行事曆」，匯入手機行事曆後鎖屏也會準時提醒。<br>
  🧭 導航按鈕會直接開啟 Google 地圖；✅ 已完成與 💬 留言板可多人共用（見下方「正式版規劃」分頁的設定說明）。<br>
  所有交通時間、航班時間為討論時的估算值，請於出發前依實際機票與租車資訊再次確認。
</footer>

<script>
const DAYS = [
  {
    id: 'd1', day:'Day 1', date:'9/5 (五)', iso:'2026-09-05', theme:'出發 → 名護',
    route: [
      {icon:'🏠', label:'台南', time:'06:20'},
      {icon:'✈️', label:'小港機場', time:'07:10'},
      {icon:'🛬', label:'那霸機場', time:'13:00'},
      {icon:'🍔', label:'A&W(彈性)', time:'13:15'},
      {icon:'🚌', label:'OTS接駁', time:'14:00'},
      {icon:'🛍️', label:'iias豐崎', time:'15:20'},
      {icon:'🧥', label:'Workman', time:'18:15'},
      {icon:'🏨', label:'名護', time:'20:30'},
    ],
    summary: '台南出發 → 小港機場 → 那霸機場 → A&W 午餐 → 租車 → iias 豐崎 → Workman → 名護入住',
    items: [
      {time:'06:10', icon:'🔔', title:'準備出發提醒', note:'把行李、護照、證件再確認一次', transition:true},
      {time:'06:20', icon:'🚗', title:'從台南住家出發', note:'前往高雄小港機場，車程約 40–50 分鐘', transition:true},
      {time:'07:10', icon:'🛫', title:'抵達小港機場', note:'國際線建議起飛前 3 小時到，辦理報到、託運、安檢', transition:false},
      {time:'09:25', icon:'⏰', title:'報到截止確認（最晚時間）', note:'虎航規定起飛前 45 分鐘截止報到（10:10 起飛）。若有 delay 這是硬底線，確認報到手續已完成，逾時不候', transition:true},
      {time:'10:10', icon:'✈️', title:'搭機飛往沖繩那霸', note:'虎航 IT288，KHH→OKA', transition:false},
      {time:'13:00', icon:'🛬', title:'抵達那霸機場（沖繩時間）', note:'入境、提領行李；1F 到達層旁有 Lawson，可先買水/點心', transition:false, nav:'那覇空港'},
      {time:'13:15', icon:'🍔', title:'午餐：A&W 那霸空港店（彈性，可視情況跳過）', note:'虎航無機上餐。從國際線1F入境大廳出關後，沿指標走連絡通道到國內線航廈，搭電扶梯上3F，A&W就在JAL櫃台後方；必點招牌培根堡＋Root Beer（無酒精，可續杯）。若不去，1F 走去國內線航廈的路是接駁車必經路線，一樣要走', transition:false, nav:'A&W 那覇空港店'},
      {time:'13:40', icon:'🚶', title:'走往國內線航廈搭接駁車', note:'國際線入境為 1F，需沿「國內線連絡通路」指標步行約 5–8 分鐘到國內線航廈；接駁車不管有沒有去 A&W 都要走這段', transition:true},
      {time:'14:00', icon:'🚌', title:'國內線 1F 出口④搭 OTS 接駁車', note:'過馬路即達「10號」乘車處，向現場工作人員報訂位人姓名即可上車（人工帶位，不用自己找車），約每 15 分鐘一班，車程約 20 分', transition:false},

function toMinutes(t){
  const [h,m] = t.split(':').map(Number);
  return h*60+m;
}
function toTimeStr(mins){
  mins = ((mins % 1440) + 1440) % 1440;
  const h = Math.floor(mins/60).toString().padStart(2,'0');
  const m = (mins%60).toString().padStart(2,'0');
  return `${h}:${m}`;
}

const ROUTE_COLORS = ['#FFC33D','#FF7A59','#0E7C86'];
const routeSvgHolder = document.getElementById('routeSvgHolder');

function renderRouteMap(day){
  const nodes = day.route;
  const n = nodes.length;
  const width = Math.max(820, n * 110);
  const height = 235;
  const padX = 60;
  const topY = 85, bottomY = 140;

  // compute point positions along a gentle alternating wave
  const pts = nodes.map((node, i) => {
    const x = n === 1 ? width/2 : padX + i * (width - 2*padX) / (n - 1);
    const wave = Math.sin((i / Math.max(n-1,1)) * Math.PI * 1.6 + 0.4);
    const y = 105 + wave * 40 * (i % 2 === 0 ? 1 : -1) * 0.55 + (i % 2 === 0 ? -20 : 20);
    return {x, y: Math.max(topY, Math.min(bottomY, y))};
  });

  // smooth path through points (Catmull-Rom -> Bezier)
  let pathD = '';
  if(pts.length === 1){
    pathD = `M${pts[0].x},${pts[0].y}`;
  } else {
    pathD = `M${pts[0].x},${pts[0].y} `;
    for(let i=0; i<pts.length-1; i++){
      const p0 = pts[i-1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i+1];
      const p3 = pts[i+2] || p2;
      const c1x = p1.x + (p2.x - p0.x)/6;
      const c1y = p1.y + (p2.y - p0.y)/6;
      const c2x = p2.x - (p3.x - p1.x)/6;
      const c2y = p2.y - (p3.y - p1.y)/6;
      pathD += `C${c1x},${c1y} ${c2x},${c2y} ${p2.x},${p2.y} `;
    }
  }

  let nodesSvg = '';
  nodes.forEach((node, i) => {
    const p = pts[i];
    const color = ROUTE_COLORS[i % ROUTE_COLORS.length];
    const goesUp = p.y < 105;
    const labelY = goesUp ? p.y - 24 : p.y + 34;
    const timeY = goesUp ? p.y - 40 : p.y + 50;
    const timeText = node.time ? `${i === 0 ? '出發' : '抵達'} ${node.time}` : '';
    nodesSvg += `
      <g>
        <circle cx="${p.x}" cy="${p.y}" r="16" fill="${color}"/>
        <text x="${p.x}" y="${p.y+5}" text-anchor="middle" font-size="14">${node.icon}</text>
        <text x="${p.x}" y="${labelY}" class="route-node-label" text-anchor="middle">${node.label}</text>
        ${timeText ? `<text x="${p.x}" y="${timeY}" class="route-node-sub" text-anchor="middle">${timeText}</text>` : ''}
      </g>`;
  });

  routeSvgHolder.style.minWidth = width + 'px';
  routeSvgHolder.innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">
      <path d="${pathD}" fill="none" stroke="#0E7C86" stroke-width="4"
            stroke-linecap="round" stroke-dasharray="1 14" opacity="0.55"/>
      ${nodesSvg}
    </svg>`;
  routeTitleEl.textContent = `✈️ ${day.day}（${day.date}）路線：${day.theme}`;
  renderDayWeather(day);
}

// ---------- .ics calendar export ----------
function icsDateUTC(iso, hhmm){
  const [y,m,d] = iso.split('-').map(Number);
  const [hh,mm] = hhmm.split(':').map(Number);
  const utcMs = Date.UTC(y, m-1, d, hh, mm) - 9*3600*1000; // Okinawa is UTC+9, no DST
  const dt = new Date(utcMs);
  const pad = n => String(n).padStart(2,'0');
  return `${dt.getUTCFullYear()}${pad(dt.getUTCMonth()+1)}${pad(dt.getUTCDate())}T${pad(dt.getUTCHours())}${pad(dt.getUTCMinutes())}00Z`;
}
function icsEscape(text){
  return String(text || '').replace(/\\/g,'\\\\').replace(/([,;])/g,'\\$1').replace(/\n/g,'\\n');
}
function buildICS(events){
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//okinawa-trip//mvp//ZH','CALSCALE:GREGORIAN'];
  events.forEach(ev => {
    const endTime = toTimeStr(toMinutes(ev.time) + 30);
    lines.push('BEGIN:VEVENT');
    lines.push('UID:' + ev.uid + '@okinawa-trip.local');
    lines.push('DTSTAMP:' + icsDateUTC(ev.iso, ev.time));
    lines.push('DTSTART:' + icsDateUTC(ev.iso, ev.time));
    lines.push('DTEND:' + icsDateUTC(ev.iso, endTime));
    lines.push('SUMMARY:' + icsEscape(ev.title));
    if(ev.note) lines.push('DESCRIPTION:' + icsEscape(ev.note));
    if(ev.nav) lines.push('LOCATION:' + icsEscape(ev.nav));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadICS(filename, icsText){
  const blob = new Blob([icsText], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename.replace(/[\\/:*?"<>|]/g, '_');
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  if(weatherLoadError){
    el.innerHTML = '';
    if(note) note.textContent = '天氣資料載入失敗，請檢查網路連線';
    return;
  }
  if(!weatherHourly){
    el.innerHTML = '<div class="weather-slot">載入天氣中…</div>';
    if(note) note.textContent = '';
    return;
  }
  const slots = WEATHER_SLOT_HOURS.map(hour => {
    const target = `${day.iso}T${String(hour).padStart(2,'0')}:00`;
    const idx = weatherHourly.time.indexOf(target);
    if(idx === -1) return null;
    return {
      hour,
      icon: WMAP[weatherHourly.weathercode[idx]] || '🌡️',
      temp: Math.round(weatherHourly.temperature_2m[idx]),
      rain: weatherHourly.precipitation_probability[idx]
    };
  }).filter(Boolean);

  if(!slots.length){
    el.innerHTML = '';
    if(note) note.textContent = '目前超出天氣預報範圍（通常只能抓未來 16 天），接近出發日再重新整理頁面看看';
    return;
  }
  el.innerHTML = slots.map(s => `
    <span class="weather-slot">
      <span class="ws-time">${s.hour}:00</span>
      <span class="ws-icon">${s.icon}</span>
      <span>${s.temp}°</span>
      <span class="ws-rain">☔${s.rain}%</span>
    </span>`).join('');
  if(note) note.textContent = '天氣預報來自 Open-Meteo，僅供參考，出發前請再次確認最新預報／颱風警報';
}

(async function loadWeather(){
  try{
    // Naha, Okinawa coordinates
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=26.2124&longitude=127.6809&hourly=weathercode,temperature_2m,precipitation_probability&timezone=Asia%2FTokyo&forecast_days=16';
    const res = await fetch(url);
    if(!res.ok) throw new Error('weather fetch failed');
    const data = await res.json();
    weatherHourly = data.hourly;
  } catch(e){
    weatherLoadError = true;
  }
  const activeDay = DAYS.find(d => d.id === currentActiveId);
  if(activeDay) renderDayWeather(activeDay);
})();

// --- Simple in-tab notification demo (MVP) ---
const notifyBtn = document.getElementById('notifyBtn');
let notifyEnabled = false;
notifyBtn.addEventListener('click', async () => {
  if(!('Notification' in window)){
    alert('這個瀏覽器不支援通知功能，建議改用行事曆提醒。');
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm === 'granted'){
    notifyEnabled = true;
    notifyBtn.classList.add('active');
    notifyBtn.textContent = '✅ 提醒已啟用（此分頁需保持開啟）';
    alert('提醒已啟用！這是示範功能：只有這個分頁保持開啟時才會跳通知，適合出發當天放著參考。正式使用建議把提醒時間加進手機行事曆。');
  }
});

// ---------- PWA: offline caching + installable app ----------
// Requires being served over https (or http://localhost) — service workers do not
// run when the file is opened directly as file:///, so this needs real hosting
// (e.g. Firebase Hosting, GitHub Pages, Netlify) to actually take effect.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
